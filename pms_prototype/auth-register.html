<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HearIntel — Create Clinician Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-canvas {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2B3035;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
    }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="auth-canvas">
    <div class="auth-card">
      <div style="margin-bottom:24px;">
        <div class="brand-name" style="color:var(--text-primary);font-size:22px;">Hear<span style="color:var(--teal);">Intel</span></div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--text-secondary);text-transform:uppercase;margin-top:2px;">Practice Management Platform</div>
        <h1 style="font-size:18px;font-weight:700;margin-top:16px;color:var(--text-primary);">Create your clinician account</h1>
        <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Enter your basic professional details to begin.</p>
      </div>

      <form onsubmit="handleRegisterSubmit(event)">
        <div class="form-grid" style="grid-template-columns:1fr;gap:12px;margin-bottom:18px;">
          <div class="field">
            <label for="regName">Full Name</label>
            <input id="regName" required placeholder="e.g. Dr. Chika Okafor" value="Dr. Chika Okafor">
          </div>
          <div class="field">
            <label for="regEmail">Professional Email</label>
            <input id="regEmail" type="email" required placeholder="chika.okafor@clinic.org" value="chika.okafor@lagoshearing.org">
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <input id="regPassword" type="password" required value="SecurePass2026!">
          </div>
        </div>

        <button type="submit" class="btn primary" style="width:100%;min-height:38px;font-size:13.5px;font-weight:600;">Continue to Verification →</button>
      </form>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-light);text-align:center;font-size:12.5px;color:var(--text-secondary);">
        Already have an account? <a href="00-dashboard.html" style="color:var(--teal);font-weight:600;">Sign in directly</a>
      </div>
    </div>
  </div>
  <div class="toast"></div>
  <script src="data.js"></script>
  <script src="prototype.js"></script>
  <script>
    function handleRegisterSubmit(event) {
      event.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      localStorage.setItem('hearintel_reg_name', name);
      localStorage.setItem('hearintel_reg_email', email);
      notify('Account initiated. Verification code sent to ' + email);
      setTimeout(() => location.href = 'auth-verify.html', 600);
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
