<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HearIntel — Clinical Media Repository</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div data-shell="media"></div>
    <main class="main">
      <section class="page">
        <header class="topbar">
          <div>
            <div class="eyebrow">Diagnostic Records</div>
            <h1 class="title">Clinical Media & Documents</h1>
            <p class="subtle">High-resolution otoscopy captures, signed diagnostic summaries, tympanometry XML curves, and consent documentation.</p>
          </div>
          <div class="actions">
            <a class="btn" id="profRecordBtn" href="02-profile.html?patient=amaia">Back to Patient Record</a>
            <button class="btn primary" onclick="openUploadMediaModal()">+ Upload Media</button>
          </div>
        </header>

        <div class="surface" style="padding:20px;">
          <div class="tabs" style="margin:-20px -20px 20px -20px;">
            <button type="button" class="tab active" onclick="filterMediaTab(this, 'all')">All Attachments (<span id="mediaAllCount">4</span>)</button>
            <button type="button" class="tab" onclick="filterMediaTab(this, 'otoscopy')">Otoscopy Captures (2)</button>
            <button type="button" class="tab" onclick="filterMediaTab(this, 'reports')">Diagnostic Reports (1)</button>
            <button type="button" class="tab" onclick="filterMediaTab(this, 'curves')">Immittance Exports (1)</button>
          </div>

          <div id="mediaGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
            <!-- Populated via JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Interactive Lightbox Preview Modal -->
  <div class="modal-backdrop" id="mediaPreviewModal">
    <div class="modal-dialog" style="max-width:680px;">
      <div class="panel-header">
        <div>
          <h3 class="panel-title" id="previewTitle">Media Inspection</h3>
          <p class="panel-subtitle" id="previewMeta">High-resolution otoscopic capture</p>
        </div>
        <button class="btn ghost" onclick="closeModal('mediaPreviewModal')">✕</button>
      </div>
      <div class="panel-body" style="text-align:center;background:#000;padding:16px;">
        <div id="previewMediaContainer" style="max-height:360px;display:flex;align-items:center;justify-content:center;">
          <!-- SVG or Image Preview -->
        </div>
      </div>
      <div style="padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:#F8FAFB;border-top:1px solid var(--border-light);">
        <span style="font-size:12px;color:var(--text-secondary);" id="previewTag">AD · Intact TM with healthy cone of light</span>
        <button class="btn" onclick="notify('Downloading high-res file...');closeModal('mediaPreviewModal')">Download File</button>
      </div>
    </div>
  </div>

  <div class="toast"></div>
  <script src="data.js"></script>
  <script src="prototype.js"></script>
  <script>
    let activeMediaTab = 'all';

    function renderMedia() {
      if (!window.HearIntelDB) return;
      const patientId = getActivePatientId();
      const patient = window.HearIntelDB.getPatient(patientId);
      document.getElementById('profRecordBtn').href = '02-profile.html?patient=' + patientId;

      const media = patient.media || [];
      document.getElementById('mediaAllCount').textContent = media.length;
      const grid = document.getElementById('mediaGrid');

      const filtered = media.filter(m => {
        if (activeMediaTab === 'otoscopy') return m.type.includes('Otoscopy');
        if (activeMediaTab === 'reports') return m.type.includes('Report') || m.type.includes('PDF');
        if (activeMediaTab === 'curves') return m.type.includes('Immittance') || m.type.includes('XML');
        return true;
      });

      if (filtered.length > 0) {
        grid.innerHTML = filtered.map(m => `
          <div class="surface" style="padding:12px;background:var(--bg-subtle);cursor:pointer;transition:transform 120ms ease;" onclick="openMediaPreview('${m.name}', '${m.type}', '${m.tag}')">
            <div style="height:120px;background:#E8ECEF;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:var(--text-secondary);font-size:12px;">
              <span style="color:var(--teal);">${m.type}</span>
              <span style="font-size:10px;color:var(--text-tertiary);margin-top:4px;">Click to inspect</span>
            </div>
            <div style="margin-top:8px;">
              <strong style="font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name}</strong>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${m.date} · ${m.size}</div>
            </div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:36px;color:var(--text-secondary);">No media records found in this category.</div>`;
      }
    }

    function filterMediaTab(btn, tab) {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeMediaTab = tab;
      renderMedia();
    }

    function openMediaPreview(name, type, tag) {
      document.getElementById('previewTitle').textContent = name;
      document.getElementById('previewMeta').textContent = type + ' · High-Resolution Clinical Record';
      document.getElementById('previewTag').textContent = tag || 'Attached Clinical Record';
      
      const container = document.getElementById('previewMediaContainer');
      if (type.includes('Otoscopy')) {
        container.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='440' height='260' viewBox='0 0 400 240'><defs><radialGradient id='earGlow' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='#D48872'/><stop offset='60%' stop-color='#9E4732'/><stop offset='100%' stop-color='#421A10'/></radialGradient></defs><rect width='400' height='240' fill='#1E2429'/><circle cx='200' cy='120' r='85' fill='url(#earGlow)' stroke='#C26850' stroke-width='2'/><path d='M200,60 Q190,110 185,130' stroke='#F4E0D6' stroke-width='4' fill='none' stroke-linecap='round'/><circle cx='185' cy='130' r='3' fill='#FFF'/><polygon points='185,130 230,165 200,175' fill='#FFF' opacity='0.55'/></svg>`;
      } else {
        container.innerHTML = `<div style="color:#fff;font-size:14px;padding:40px;">[ Document Preview for ${name} ]</div>`;
      }

      openModal('mediaPreviewModal');
    }

    function openUploadMediaModal() {
      const patientId = getActivePatientId();
      const name = prompt('Enter filename to upload (e.g. Otoscopy_Review.jpg):', 'Otoscopy_Review.jpg');
      if (name && window.HearIntelDB) {
        window.HearIntelDB.addMedia(patientId, {
          name: name,
          type: name.endsWith('.pdf') ? 'Report PDF' : 'Otoscopy Image',
          size: '1.8 MB',
          tag: 'Uploaded record'
        });
        renderMedia();
        notify('File attached to ' + patientId.toUpperCase() + ' record.');
      }
    }

    document.addEventListener('DOMContentLoaded', renderMedia);
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
