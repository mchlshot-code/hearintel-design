name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: prototype-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check frontend JavaScript syntax
        run: |
          node --check landing_page_prototype/onboarding.js
          node --check landing_page_prototype/navigation.js
          node --check landing_page_prototype/onboarding-contract.mjs
          node --check landing_page_prototype/preview-submission.mjs
      - name: Verify onboarding contracts and recovery
        run: npm test
